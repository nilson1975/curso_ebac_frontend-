<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <h1>Visite o Parque do Lago</h1>
    <p class="display-6">Faça sua inscrição no Formulário Abaixo e Reserve sua visita <mark>por Apenas 5,00 Reais</mark> </p>
    <br>
    <br>
    <div class="container">
        <div class="row">
            <div class="col">
                <img src="https://tse2.mm.bing.net/th/id/OIP.5W0DLWm_E5Ir3L5VE-2ONAHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="">
                <h3>Cachoeira do Brito</h3>
            </div>
            <div class="col">
                <img src="https://tse2.mm.bing.net/th/id/OIP.pxvodwI2ijc-_kt_42aJUwHaEo?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="">
                <h3>Entrada do Lago</h3>
            </div>
            <div class="col">
                <img src="https://tse3.mm.bing.net/th/id/OIP.IDuqCXU_noJLpkEdOfazJAHaC4?r=0&w=1280&h=498&rs=1&pid=ImgDetMain&o=7&rm=3" alt="">
                <h3>Área de Descanso</h3>
                <br>
                <br>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <h2>Entre em Contato:</h2>
                <form>
                    <label class="form-label" for="nome">Seu Nome:</label>
                    <input class="form-control" type="text" id="nome" />
                    <label class="form-label" for="email">Seu Email:</label>
                    <input id="email" type="email" class="form-control"/>
                    <label class="form-label" for="telefone">Seu Telefone:</label>
                    <input id="telefone" type="tel" class="form-control"/>
                    <div class="text-end mt-3">
                        <button class="btn btn-primary" type="submit">Enviar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
